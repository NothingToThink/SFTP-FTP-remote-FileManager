name: Build release

on:
  push:
    tags:
      - "gui-build-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: py -m pip install -r requirements.txt

      - name: Build GUI
        run: py -m PyInstaller --noconfirm --clean --onefile --windowed --name FileManager GUI.py

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "Windows build of the GUI client."
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag dist\FileManager.exe --title "GUI build $tag" --notes $notes
          } else {
            gh release upload $tag dist\FileManager.exe --clobber
          }
