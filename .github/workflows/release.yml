name: Build release

on:
  push:
    tags:
      - "gui-build-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: py -m pip install -r requirements.txt

      - name: Build GUI
        run: py -m PyInstaller --noconfirm --clean --onedir --windowed --name FileManager GUI.py

      - name: Build LocalServer
        run: py -m PyInstaller --noconfirm --clean --onedir --console --add-data "api.json;." --add-data "docs.html;." --name LocalServer local_server.py

      - name: Pack artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\FileManager\*" -DestinationPath "FileManager-GUI.zip" -Force
          Compress-Archive -Path "dist\LocalServer\*" -DestinationPath "LocalServer.zip" -Force

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "GUI и LocalServer для Windows. Сначала запустить LocalServer.exe, затем FileManager.exe."
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag FileManager-GUI.zip LocalServer.zip --title "GUI build $tag" --notes $notes
          } else {
            gh release upload $tag FileManager-GUI.zip LocalServer.zip --clobber
          }
